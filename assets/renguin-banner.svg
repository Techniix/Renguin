<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Renguin: teaching Haiku to run Linux applications">
  <title>Renguin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#16242e"/>
    </linearGradient>
    <linearGradient id="enso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#de911d"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7eef2"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd9df"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- mark -->
  <g transform="translate(210,210)">
    <circle r="150" fill="#101d25"/>
    <path d="M0 -140 a140 140 0 1 0 99 41" fill="none" stroke="url(#enso)"
          stroke-width="14" stroke-linecap="round"/>
    <!-- 5-7-5 reeds -->
    <g stroke="#f0b429" stroke-width="5" stroke-linecap="round" opacity="0.5">
      <line x1="-74" y1="78" x2="-74" y2="48"/>
      <line x1="-61" y1="78" x2="-61" y2="36"/>
      <line x1="-48" y1="78" x2="-48" y2="54"/>
    </g>
    <!-- penguin -->
    <path d="M0 -66 c-37 0 -61 30 -61 74 c0 33 7 61 17 82 c6 13 19 21 44 21
             c25 0 38 -8 44 -21 c10 -21 17 -49 17 -82 c0 -44 -24 -74 -61 -74 z" fill="#12212b"/>
    <path d="M0 -34 c-21 0 -33 18 -33 50 c0 28 6 54 13 71 c3 8 10 13 20 13
             c10 0 17 -5 20 -13 c7 -17 13 -43 13 -71 c0 -32 -12 -50 -33 -50 z" fill="url(#belly)"/>
    <path d="M0 -34 l-14 11 l14 7 l14 -7 z" fill="#f0932b"/>
    <circle cx="-13" cy="-40" r="4.6" fill="#0c161d"/>
    <circle cx="13" cy="-40" r="4.6" fill="#0c161d"/>
    <path d="M-17 104 q-11 7 -18 6 q7 7 21 4 z" fill="#f0932b"/>
    <path d="M17 104 q11 7 18 6 q-7 7 -21 4 z" fill="#f0932b"/>
    <!-- ripple -->
    <circle cx="60" cy="86" r="14" fill="none" stroke="#2b4250" stroke-width="2.4"/>
    <circle cx="60" cy="86" r="24" fill="none" stroke="#223642" stroke-width="1.8"/>
    <!-- seal -->
    <g transform="translate(96,-88)">
      <rect x="-17" y="-17" width="34" height="34" rx="6" fill="#c0392b"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif"
            font-size="16" font-weight="700" fill="#fff">R</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="430" y="196" font-family="Georgia, 'Times New Roman', serif"
        font-size="104" font-weight="700" fill="url(#word)" letter-spacing="1">Renguin</text>
  <text x="434" y="250" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" fill="#f0b429" letter-spacing="0.5">Teaching Haiku to run Linux applications</text>

  <!-- the project's haiku, 5-7-5 -->
  <g font-family="Georgia, serif" font-size="21" fill="#8fa3ad" font-style="italic">
    <text x="434" y="312">An old pond, quiet —</text>
    <text x="434" y="344">a penguin slips through the gate</text>
    <text x="434" y="376">and swims in new water.</text>
  </g>
</svg>
